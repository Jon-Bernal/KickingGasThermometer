<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      box-sizing: border-box;
    }

    #container {
      position: relative;
      box-sizing: border-box;
      height: fit-content;
      width: 500px;
      margin: 0;
      padding: 0;
    }

    #green {
      box-sizing: border-box;
      background-image: url('https://images.squarespace-cdn.com/content/635023a3f9478442b304877b/8f656d42-5d3f-4ecb-8930-20f7fefc7256/plant-green.jpg?content-type=image%2Fjpeg');
      background-size: cover;
      position: absolute;
      z-index: 1;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 19%;
      /* 
      19% is 0 
      63.4% is 100
      */
      margin: 0;
      padding: 0;
      background-position: bottom;
    }

    #gray {
      position: relative;
      box-sizing: border-box;
      height: auto;
      width: 100%;
      margin: 0;
      padding: 0;
      display: block;
    }
  </style>

</head>

<body>
  <div id="container">
    <img
      src="https://images.squarespace-cdn.com/content/635023a3f9478442b304877b/ba8cc914-8b38-47c1-9df8-82b55554785f/plant-gray.jpg?content-type=image%2Fjpeg"
      alt="Donation " id="gray" />
    <div id="green">
      <p></p>
    </div>
  </div>

  <script>
    function updateHeight(donations) {
      const percent = (donations / 60000);
      console.log('percent :>> ', percent);
      const overlay = document.querySelector('#green');
      console.log('overlay :>> ', overlay);
      overlay.style.height = `${19 + (percent * (63.4 - 19))}%`
      console.log('(percent * 63.4) :>> ', (percent * (63.4 - 19)));
    }

    updateHeight(36000);
  </script>
</body>

</html>
